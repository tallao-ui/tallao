<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 742" width="1200" height="742" role="img" aria-labelledby="t d">
<title id="t">How an app uses tallao</title>
<desc id="d">The package exports tallao, tallao/map, tallao/code, tallao/tokens.css and tallao/base.css. An app installs it with pnpm add github:tallao-ui/tallao or copies a component. It runs in SvelteKit with server rendering, in Astro islands with setDefaultLabels, and in Kitsuden kon views inside a Shadow DOM through ThemeScope.</desc>
<style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style>
<rect x="1" y="1" width="1198" height="740" rx="28" fill="#0f1520" stroke="#2a3446" stroke-width="2"/>
<text class="s" x="40.0" y="66.0" font-size="30" fill="#f1f5f9" font-weight="800">How an app uses tallao</text>
<rect x="40.0" y="100.0" width="600.0" height="268.0" rx="18" fill="#161e2c" stroke="#2a3446" stroke-width="2"/>
<rect x="64" y="114" width="48" height="6" rx="3" fill="#c084fc"/>
<text class="s" x="64.0" y="152.0" font-size="20" fill="#a8b3c4">1  What the package exports</text>
<text class="m" x="64.0" y="196.0" font-size="20" fill="#f1f5f9" font-weight="700">tallao</text>
<text class="s" x="300.0" y="196.0" font-size="20" fill="#a8b3c4">components, toast(), setLabels()</text>
<text class="m" x="64.0" y="230.0" font-size="20" fill="#f1f5f9" font-weight="700">tallao/map</text>
<text class="s" x="300.0" y="230.0" font-size="20" fill="#a8b3c4">GameMap (leaflet, sveaflet)</text>
<text class="m" x="64.0" y="264.0" font-size="20" fill="#f1f5f9" font-weight="700">tallao/code</text>
<text class="s" x="300.0" y="264.0" font-size="20" fill="#a8b3c4">CodeEditor (CodeMirror 6)</text>
<text class="m" x="64.0" y="298.0" font-size="20" fill="#f1f5f9" font-weight="700">tallao/tokens.css</text>
<text class="s" x="300.0" y="298.0" font-size="20" fill="#a8b3c4">every --ta-* variable</text>
<text class="m" x="64.0" y="332.0" font-size="20" fill="#f1f5f9" font-weight="700">tallao/base.css</text>
<text class="s" x="300.0" y="332.0" font-size="20" fill="#a8b3c4">base styles</text>
<rect x="680.0" y="100.0" width="480.0" height="268.0" rx="18" fill="#161e2c" stroke="#2a3446" stroke-width="2"/>
<rect x="704" y="114" width="48" height="6" rx="3" fill="#60a5fa"/>
<text class="s" x="704.0" y="152.0" font-size="20" fill="#a8b3c4">2  Two ways in</text>
<text class="s" x="704.0" y="192.0" font-size="22" fill="#f1f5f9" font-weight="700">As a package</text>
<text class="m" x="704.0" y="224.0" font-size="20" fill="#c084fc">pnpm add github:tallao-ui/tallao</text>
<text class="s" x="704.0" y="276.0" font-size="22" fill="#f1f5f9" font-weight="700">Or copy a component</text>
<text class="m" x="704.0" y="308.0" font-size="20" fill="#a8b3c4">components/&lt;name&gt;.svelte, internal/,</text>
<text class="s" x="704.0" y="336.0" font-size="20" fill="#a8b3c4">utils.ts and the two CSS files</text>
<line x1="646" y1="234.0" x2="666" y2="234.0" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/><path d="M662 225.0 L676 234.0 L662 243.0 Z" fill="#c084fc"/>
<line x1="600.0" y1="376" x2="600.0" y2="414" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/><path d="M591.0 410 L600.0 424 L609.0 410 Z" fill="#c084fc"/>
<text class="s" x="622.0" y="408.0" font-size="20" fill="#a8b3c4">Svelte 5.29 or later</text>
<rect x="40.0" y="432.0" width="1120.0" height="270.0" rx="18" fill="#161e2c" stroke="#2a3446" stroke-width="2"/>
<text class="s" x="64.0" y="476.0" font-size="20" fill="#a8b3c4">3  Where it runs</text>
<rect x="64.0" y="498.0" width="346.7" height="182.0" rx="14" fill="#0f1520" stroke="#34d399" stroke-width="2"/>
<text class="s" x="84.0" y="534.0" font-size="22" fill="#f1f5f9" font-weight="700">SvelteKit</text>
<text class="s" x="84.0" y="570.0" font-size="20" fill="#a8b3c4">server rendering, hydration</text>
<text class="m" x="84.0" y="598.0" font-size="20" fill="#f1f5f9">$props.id()</text>
<text class="s" x="84.0" y="626.0" font-size="20" fill="#a8b3c4">keeps ids stable</text>
<text class="s" x="84.0" y="654.0" font-size="20" fill="#a8b3c4">controls submit with name</text>
<rect x="426.7" y="498.0" width="346.7" height="182.0" rx="14" fill="#0f1520" stroke="#fbbf24" stroke-width="2"/>
<text class="s" x="446.7" y="534.0" font-size="22" fill="#f1f5f9" font-weight="700">Astro islands</text>
<text class="s" x="446.7" y="570.0" font-size="20" fill="#a8b3c4">each island is its own root:</text>
<text class="m" x="446.7" y="598.0" font-size="20" fill="#f1f5f9">setDefaultLabels(es)</text>
<text class="s" x="446.7" y="626.0" font-size="20" fill="#a8b3c4">NavMenu and BottomNav</text>
<text class="s" x="446.7" y="654.0" font-size="20" fill="#a8b3c4">need no hydration</text>
<rect x="789.3" y="498.0" width="346.7" height="182.0" rx="14" fill="#0f1520" stroke="#f472b6" stroke-width="2"/>
<text class="s" x="809.3" y="534.0" font-size="22" fill="#f1f5f9" font-weight="700">Kitsuden kon views</text>
<text class="s" x="809.3" y="570.0" font-size="20" fill="#a8b3c4">custom elements in a</text>
<text class="s" x="809.3" y="598.0" font-size="20" fill="#a8b3c4">Shadow DOM, wrapped in</text>
<text class="m" x="809.3" y="626.0" font-size="20" fill="#f1f5f9">&lt;ThemeScope&gt;</text>
<text class="m" x="809.3" y="654.0" font-size="20" fill="#f1f5f9">--kitsuden-* → --ta-*</text>
</svg>
