<title id="t">tallao</title>
<desc id="d">tallao, a Svelte 5 UI kit for generative interfaces. Its components, grouped by family: actions and feedback, forms, overlays and menus, navigation and layout, data, and generative UI. GameMap and CodeEditor ship from separate entry points.</desc>
