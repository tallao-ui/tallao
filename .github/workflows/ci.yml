name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Fija la imagen: ubuntu-latest pasó a 26.04 y Playwright 1.58 aún no instala Chromium ahí.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # prepare (svelte-package) corre en el install y ya prueba que el paquete compila.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm package
      - run: pnpm build:demo
      # tallao dentro de una app SvelteKit real (kit-check/): prerender sin estado compartido
      # entre peticiones, e hidratación sin desajustes en Chromium.
      - run: pnpm --filter tallao-kit-check build
      - run: pnpm --filter tallao-kit-check exec playwright install --with-deps chromium
      - run: pnpm --filter tallao-kit-check test
        env:
          CI: "1"
